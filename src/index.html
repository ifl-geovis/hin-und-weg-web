<!DOCTYPE html>
<html lang="de">
<head>
    <title>hin&amp;weg — Wanderungen zwischen Landkreisen</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/x-icon" href="img/huw-logo_32.ico">

    <link rel="stylesheet" href="fonts/overpass.css">
    <link rel="stylesheet" href="lib/leaflet.css">
    <link rel="stylesheet" href="lib/geostats.css">
    <link rel="stylesheet" href="main.css">

    <script src="lib/leaflet.js"></script>
    <script src="lib/Leaflet.SwoopyArrow.js"></script>
    <script src="lib/turf.min.js"></script>
    <script src="lib/alasql.min.js"></script>
    <script src="lib/chroma.min.js"></script>
    <script src="lib/geostats.js"></script>

    <!-- Vorgeladene Daten (einmalig erzeugt durch tools/build-preload.js) -->
    <script src="data/landkreise/preload.js"></script>

    <script src="util.js"></script>
    <script src="main.js"></script>
    <script src="map.js"></script>
    <script src="init.js"></script>
</head>
<body>

<!-- Title header -->
<div id="header">
    <img src="img/huw-logo_32.png" alt="hin&weg Logo" />
    <h1>hin&amp;weg</h1>
    <h3 id="dataset_title">Wanderungen zwischen Landkreisen</h3>
</div>

<!-- Year badge + play button -->
<div id="year_play_container">
    <div id="current_year_badge" class="year-badge" aria-live="polite" title="Ausgewähltes Jahr"></div>
    <button id="year_play_toggle" type="button"
            aria-pressed="false" aria-label="Jahre abspielen"
            onclick="toggle_year_playback()" disabled>
        <img id="year_play_icon" src="img/play.svg" alt="" class="icon" aria-hidden="true" />
    </button>
</div>

<!-- Year slider (Hands-On gelb) -->
<div id="year_slider_container">
    <label for="year_slider" class="year-slider-label">Jahr wählen</label>
    <input type="range" id="year_slider"
           min="0" max="0" value="0" step="1"
           oninput="year_slider_changed(event)"
           disabled />
    <div id="year_slider_marks" aria-hidden="true"></div>
</div>

<!-- Map -->
<div id="leafletmap"></div>

<!-- Feature info popup -->
<div id="feature_info_popup"></div>

<!-- Load indicator -->
<div id="load_indicator">
    <div id="load_indicator_text">Bitte warten!<br /><span id="load_indicator_message"></span></div>
    <div id="load_inidicator_blocks">
        <div class="load_inidicator_block"></div><div class="load_inidicator_block"></div>
        <div class="load_inidicator_block"></div><div class="load_inidicator_block"></div>
        <div class="load_inidicator_block"></div><div class="load_inidicator_block"></div>
        <div class="load_inidicator_block"></div><div class="load_inidicator_block"></div>
        <div class="load_inidicator_block"></div><div class="load_inidicator_block"></div>
    </div>
</div>

<!-- Right-side action buttons -->
<div id="zoom_home_fab" class="action_button" title="Zur Gesamtansicht">
    <button type="button" aria-label="Zur Gesamtansicht" onclick="zoom_home()">
        <img src="img/globe.svg" alt="" class="icon" aria-hidden="true" />
    </button>
</div>

<div id="map_bg_fab" class="action_button" title="Hintergrundkarte umschalten">
    <button type="button" aria-label="Hintergrundkarte umschalten" onclick="map_background_switcher()">
        <img src="img/map.svg" alt="" class="icon" aria-hidden="true" />
    </button>
</div>

<!-- Hands-On: Pfeile ein/aus (gelb) -->
<div id="arrows_toggle_fab" class="action_button hands_on" title="Wanderungspfeile ein-/ausblenden">
    <button id="arrows_toggle_button" type="button" aria-pressed="true"
            aria-label="Wanderungspfeile ein-/ausblenden" onclick="toggle_arrows()">
        <img id="arrows_toggle_icon" src="img/Pfeil.png" alt="" class="icon" aria-hidden="true" />
    </button>
</div>

<!-- Legend -->
<div id="legend_view">
    <h2 class="title_bar"
        id="legend_toggle"
        role="button" tabindex="0"
        aria-expanded="true" aria-controls="legend_content"
        title="Legende ein-/ausklappen"
        onclick="toggle_legend(event)"
        onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle_legend(event);}">
        Legende
        <svg class="legend_chevron" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="6,14 12,8 18,14" stroke="currentColor" stroke-width="2.5"
                      fill="none" stroke-linecap="round" stroke-linejoin="round"></polyline>
        </svg>
    </h2>
    <div id="legend_content" class="view_content">
        <div id="legend_content_inner"></div>
    </div>
</div>

<!-- Idle overlay (Hinweis nach Inaktivität) -->
<div id="idle_overlay" aria-hidden="true">
    <div id="idle_overlay_content">
        <h2>Wanderungen in Deutschland</h2>
        <p>Tippen Sie auf einen <strong>Landkreis</strong>, um die Wanderungssaldi zu sehen.</p>
        <p>Mit dem <strong>Schieberegler</strong> wählen Sie das Jahr.</p>
    </div>
</div>

<script>init();</script>
</body>
</html>
